<svg width="800" height="260" viewBox="0 0 800 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft Background Glow -->
  <rect width="800" height="260" rx="24" fill="url(#bg-gradient)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFDF5" />
      <stop offset="100%" stop-color="#FFF8D6" />
    </linearGradient>
  </defs>

  <!-- Decorative Stars & Sparkles -->
  <g fill="#FFD21F">
    <path d="M 120 40 L 123 46 L 130 47 L 124 52 L 126 59 L 120 55 L 114 59 L 116 52 L 110 47 L 117 46 Z"/>
    <path d="M 400 25 L 402 30 L 407 31 L 403 35 L 404 40 L 400 37 L 396 40 L 397 35 L 393 31 L 398 30 Z"/>
    <path d="M 680 45 L 682 50 L 687 51 L 683 55 L 684 60 L 680 57 L 676 60 L 677 55 L 673 51 L 678 50 Z"/>
  </g>

  <!-- Cultural Skyline Vector Outlines (Tamil Nadu Gopuram, Central Station, Traditional Lamps & Earthen Vessels) -->
  <g stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Left Vessel & Steam -->
    <path d="M 40 210 Q 55 190 70 210 Z" fill="#FFD21F" stroke-width="2.5"/>
    <path d="M 35 210 H 75 L 70 230 H 40 Z" fill="#FFFFFF"/>
    <path d="M 48 185 Q 45 175 52 165" stroke="#FFCC00" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 62 185 Q 65 175 58 165" stroke="#FFCC00" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Kuthu Vilakku (Traditional Lamp 1) -->
    <path d="M 100 235 H 120 L 110 230 V 160 H 105 H 115" stroke-width="2"/>
    <path d="M 110 160 C 110 150 102 145 110 135 C 118 145 110 150 110 160 Z" fill="#FFD21F"/>

    <!-- Small Temple Shrine 1 -->
    <path d="M 140 235 V 170 H 190 V 235" fill="#FFFFFF"/>
    <path d="M 135 170 L 165 130 L 195 170 Z" fill="#FFFDF0"/>
    <path d="M 165 130 V 115" stroke-width="3"/>
    <circle cx="165" cy="112" r="4" fill="#FFD21F"/>

    <!-- Street Lamp / Heritage Pole -->
    <path d="M 225 235 V 150 M 215 150 H 235 M 225 150 L 225 135" />
    <polygon points="218,135 232,135 228,120 222,120" fill="#FFD21F"/>

    <!-- Chennai Central Clock Tower (Middle) -->
    <path d="M 320 235 V 120 H 380 V 235" fill="#FFFFFF"/>
    <path d="M 330 120 V 80 H 370 V 120" fill="#FFFDF0"/>
    <path d="M 335 80 L 350 50 L 365 80 Z" fill="#FFD21F"/>
    <circle cx="350" cy="100" r="10" stroke="#111111" fill="#FFFFFF"/>
    <path d="M 350 100 L 350 94 M 350 100 L 354 100" stroke="#111111" stroke-width="2"/>

    <!-- Palm Trees -->
    <path d="M 280 235 Q 285 180 290 140" stroke-width="2.5"/>
    <path d="M 290 140 Q 270 130 260 140 M 290 140 Q 280 120 275 110 M 290 140 Q 305 125 315 135 M 290 140 Q 310 145 320 155" stroke="#111111" stroke-width="2"/>

    <!-- Majestic Kapaleeshwarar Gopuram (Right Main Tower) -->
    <path d="M 520 235 H 630 L 615 60 H 535 Z" fill="#FFFFFF" stroke-width="2.5"/>
    <!-- Tiered Roof Lines of Gopuram -->
    <line x1="530" y1="200" x2="620" y2="200" stroke-width="2"/>
    <line x1="533" y1="165" x2="617" y2="165" stroke-width="2"/>
    <line x1="537" y1="130" x2="613" y2="130" stroke-width="2"/>
    <line x1="540" y1="95" x2="610" y2="95" stroke-width="2"/>
    <!-- Kalasam Finials on Top -->
    <path d="M 545 60 V 42 M 560 60 V 40 M 575 60 V 38 M 590 60 V 40 M 605 60 V 42" stroke="#FFD21F" stroke-width="3"/>
    <circle cx="575" cy="35" r="4" fill="#FFD21F"/>

    <!-- Steaming Biryani Pot & Bowls (Far Right) -->
    <path d="M 670 235 H 730 L 720 190 H 680 Z" fill="#FFD21F" stroke-width="2"/>
    <ellipse cx="700" cy="190" rx="22" ry="6" fill="#FFFFFF"/>
    <path d="M 690 175 Q 685 160 692 150" stroke="#FFCC00" stroke-width="2" stroke-dasharray="2 2"/>
    <path d="M 708 175 Q 715 160 705 150" stroke="#FFCC00" stroke-width="2" stroke-dasharray="2 2"/>

    <path d="M 740 235 H 775 L 770 215 H 745 Z" fill="#FFFFFF"/>
    <!-- Ground Baseline -->
    <line x1="20" y1="235" x2="780" y2="235" stroke="#111111" stroke-width="3"/>
  </g>
</svg>
